<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f766e" />
  <title>Crew Day Board</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header__top">
        <p class="eyebrow">Sheet → Day Board</p>
        <p class="header__date" id="today-date" aria-live="polite"></p>
      </div>
      <h1>Crew Day Board</h1>
      <p class="lede">Paste or upload your spreadsheet export. Run today’s jobs from one screen.</p>
    </header>

    <section class="summary" id="summary" aria-label="Day summary" hidden>
      <div class="summary__item">
        <span class="summary__value" id="stat-total">0</span>
        <span class="summary__label">Jobs</span>
      </div>
      <div class="summary__item summary__item--done">
        <span class="summary__value" id="stat-done">0</span>
        <span class="summary__label">Done</span>
      </div>
      <div class="summary__item summary__item--unpaid">
        <span class="summary__value" id="stat-unpaid">0</span>
        <span class="summary__label">Unpaid</span>
      </div>
    </section>

    <section class="import" id="import-panel" aria-label="Import spreadsheet">
      <div class="import__tabs" role="tablist">
        <button type="button" class="import__tab is-active" role="tab" aria-selected="true" data-tab="paste" id="tab-paste">Paste</button>
        <button type="button" class="import__tab" role="tab" aria-selected="false" data-tab="upload" id="tab-upload">Upload</button>
      </div>

      <div class="import__panel is-active" id="panel-paste" role="tabpanel" aria-labelledby="tab-paste">
        <label class="import__label" for="paste-input">Paste rows from Google Sheets or Excel (CSV / TSV)</label>
        <textarea
          id="paste-input"
          class="import__textarea"
          rows="6"
          placeholder="cleaner,address,status,pay&#10;Maria Garcia,142 Oak St,scheduled,unpaid&#10;James Wilson,88 Park Ave,in progress,$85"
          spellcheck="false"
        ></textarea>
        <button type="button" class="btn btn-primary" id="btn-parse-paste">Load pasted rows</button>
      </div>

      <div class="import__panel" id="panel-upload" role="tabpanel" aria-labelledby="tab-upload" hidden>
        <label class="import__label" for="file-input">Upload a .csv or .tsv export</label>
        <label class="btn btn-secondary file-label">
          Choose file
          <input type="file" id="file-input" accept=".csv,.tsv,.txt,text/csv,text/tab-separated-values" hidden />
        </label>
        <p class="import__hint" id="file-name">No file selected</p>
      </div>

      <div class="import__actions">
        <button type="button" class="btn btn-ghost" id="btn-load-sample">Load sample day</button>
        <button type="button" class="btn btn-ghost btn-sm" id="btn-toggle-import" hidden>Change import</button>
      </div>

      <p class="import__error hidden" id="import-error" role="alert"></p>
    </section>

    <section class="board" id="board" aria-label="Today’s jobs" hidden>
      <div class="board__toolbar">
        <h2 class="board__title">Today</h2>
        <div class="board__filters" role="group" aria-label="Filter jobs">
          <button type="button" class="chip is-active" data-filter="all">All</button>
          <button type="button" class="chip" data-filter="scheduled">Scheduled</button>
          <button type="button" class="chip" data-filter="in progress">In progress</button>
          <button type="button" class="chip" data-filter="done">Done</button>
        </div>
      </div>
      <ul class="job-list" id="job-list"></ul>
      <p class="board__empty hidden" id="board-empty">No jobs match this filter.</p>
    </section>

    <footer class="footer">
      <p>Demo for cleaning owner-operators · Data stays in your browser</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
